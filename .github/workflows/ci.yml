name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  secret-scan:
    name: Secret Scan & Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for uncommitted .env files
        run: |
          if [ -f .env ]; then
            echo "ERROR: .env file found in repo!"
            exit 1
          fi

      - name: Scan for suspicious secrets patterns
        run: |
          SUSPECT=$(grep -rE "(eyJh|sbp_[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{20,}|service_role|AIza[0-9A-Za-z_-]{35})" --exclude-dir=".git" --exclude-dir="node_modules" . || true)
          if [ -n "$SUSPECT" ]; then
            echo "Suspicious tokens found:"
            echo "$SUSPECT"
            exit 1
          fi

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          pytest
