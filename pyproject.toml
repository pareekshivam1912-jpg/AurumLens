[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurumlens"
version = "0.2.1"
description = "MCX gold cross-contract relative-value intelligence and hedging-cost analytics"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "AurumLens Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["engine/src"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine/src"]
addopts = "-v --strict-markers"
